name: 'Helm deployment'
description: 'Deploys a helm chart on AWS EKS'

inputs:
  k8s-name:
    description: 'The deployment name in the Kubernetes cluster'
    required: true
  k8s-namespace:
    description: 'Namespace the chart is deployed to'
    required: true
  chart-path:
    description: 'Location of the helm template directory'
    required: true
  values-file:
    description: 'Helm values file path'
    default: 'infrastructure/helm/values.yaml'
  aws-access-key-id:
    description: 'The AWS access key ID'
    required: true
  aws-secret-access-key:
    description: 'The AWS secret access key'
    required: true
  aws-eks-cluster-name:
    description: 'Name of the eks cluster'
    default: aws-main-eu-01
  aws-region:
    description: 'The AWS region'
    default: eu-west-1
  wait:
    description: 'Wait for all release resources to become ready before returning (helm --wait), i.e. block until the rollout has completed. Set to "false" for the previous fire-and-forget behaviour.'
    default: 'true'
  timeout:
    description: 'Timeout for --wait as a Go/helm duration (e.g. 300s, 5m).'
    default: '5m'
  atomic:
    description: 'Roll back the release if the upgrade fails (helm --atomic; implies --wait).'
    default: 'false'

runs:
  using: "composite"
  steps:
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ inputs.aws-access-key-id }}
        aws-secret-access-key: ${{ inputs.aws-secret-access-key }}
        aws-region: ${{ inputs.aws-region }}

    - name: Authenticate to AWS EKS
      shell: bash
      run: aws eks --region ${{ inputs.aws-region }} update-kubeconfig --name ${{ inputs.aws-eks-cluster-name }}

    - name: Helm deployment
      shell: bash
      env:
        WAIT: ${{ inputs.wait }}
        TIMEOUT: ${{ inputs.timeout }}
        ATOMIC: ${{ inputs.atomic }}
      run: |
          flags=()
          if [ "$WAIT" = "true" ]; then flags+=(--wait --timeout "$TIMEOUT"); fi
          if [ "$ATOMIC" = "true" ]; then flags+=(--atomic); fi
          helm upgrade --install "${{ inputs.k8s-name }}" "${{ inputs.chart-path }}" \
              --values "${{ inputs.values-file }}" \
              --namespace "${{ inputs.k8s-namespace }}" \
              "${flags[@]}"
